name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Native fixtures use temporary disks and fake QEMU; no hardware VM or
      # paid provider is started. Production acceptance remains a separate gate.
      - run: npm test
      - run: python3 -m py_compile runtime/native/host.py runtime/native/refresh_guest_agent.py runtime/native/sanitize_clone.py
